# AxionPanel directories. Install to /etc/tmpfiles.d/axionpanel.conf.
# /run/axionpanel is owned by the agent unit's RuntimeDirectory=, not here.
# agent.toml is deliberately absent: this file must never truncate a policy.
d /etc/axionpanel 0750 root axionpanel -
d /usr/local/axionpanel 0755 root root -
d /usr/local/axionpanel/bin 0755 root root -
d /var/lib/axionpanel 0700 axionpanel axionpanel -
