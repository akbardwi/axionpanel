# AxionPanel service account. Install to /etc/sysusers.d/axionpanel.conf.
# Creates group axionpanel first, then the panel user with that primary group.
# The agent runs as root with Group=axionpanel; both entries must exist before
# the agent starts; missing entries can cause status=216/GROUP or 217/USER.
g axionpanel -
u axionpanel - "AxionPanel service account" /var/lib/axionpanel /usr/sbin/nologin
